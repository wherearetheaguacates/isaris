<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frases de Naruto - Ánimo Feliz</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-500 text-white font-sans min-h-screen flex flex-col">
  <div id="main" class="flex flex-col items-center justify-center flex-grow p-4">
    <h1 class="text-3xl md:text-5xl font-bold mb-6 text-center">Frases para cuando te sientes feliz</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-5xl justify-items-center">
      <!-- Frases listadas aquí -->
    </div>
  </div>
  <div id="phraseScreen" class="hidden fixed inset-0 flex flex-col items-center justify-center p-4 bg-orange-500">
    <div class="bg-white text-black rounded-xl shadow-lg p-6 max-w-xl text-center">
      <p id="phraseText" class="text-lg font-medium mb-4"></p>
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button onclick="playAudio('es')" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Escuchar en Español</button>
        <button onclick="playAudio('jp')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Escuchar en Japonés</button>
      </div>
      <button onclick="goBack()" class="mt-6 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Volver</button>
    </div>
  </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const phrases = [
      {
        text: "Hoy el sol no está solo, tú también iluminas.",
        es: "Audios. Voz de naruto/Frases 1 - Feliz.wav",
        jp: "audio/feliz_1_jp.wav"
      },
      {
        text: "Esa sonrisa tuya podría derrotar a cualquier enemigo.",
        es: "Audios. Voz de naruto/Frases 2 - Feliz.wav",
        jp: "audio/feliz_6_jp.wav"
      },
      {
        text: "Tu alegría contagia más que una técnica secreta.",
        es: "Audios. Voz de naruto/Frases 3 - Feliz.wav",
        jp: "audio/feliz_9_jp.wav"
      },
    ];

    const main = document.getElementById('main');
    const phraseScreen = document.getElementById('phraseScreen');
    const phraseText = document.getElementById('phraseText');
    const audioPlayer = document.getElementById('audioPlayer');

    function openPhrase(index) {
      const phrase = phrases[index];
      phraseText.innerText = phrase.text;
      phraseScreen.classList.remove('hidden');
      main.classList.add('hidden');
      audioPlayer.dataset.es = phrase.es;
      audioPlayer.dataset.jp = phrase.jp;
    }

    function goBack() {
      phraseScreen.classList.add('hidden');
      main.classList.remove('hidden');
      audioPlayer.pause();
    }

    function playAudio(lang) {
      const src = audioPlayer.dataset[lang];
      if (src) {
        audioPlayer.src = src;
        audioPlayer.play();
      }
    }
    // Generar tarjetas de frases
    const container = document.querySelector('#main .grid');
    phrases.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'bg-white text-orange-700 hover:bg-gray-100 font-semibold py-3 px-5 rounded-xl shadow-md transition-all';
      btn.textContent = `Frase ${i + 1}`;
      btn.onclick = () => openPhrase(i);
      container.appendChild(btn);
    });
  </script>
</body>
</html>

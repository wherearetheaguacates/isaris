<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¿Cómo te sientes?</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-orange-100 via-orange-200 to-orange-300 min-h-screen flex items-center justify-center">

  <main class="bg-white/70 backdrop-blur-lg shadow-2xl rounded-3xl p-10 w-full max-w-2xl text-center space-y-10">
    <h2 class="text-4xl font-bold text-orange-700 drop-shadow-md">¿Cómo te sientes hoy?</h2>

    <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
      <!-- Opción Feliz -->
      <button
        onclick="window.location.href='Frases para cuando estes feliz.html'"
        class="bg-green-500 hover:bg-green-600 text-white font-medium px-8 py-4 rounded-2xl shadow-lg transition-transform hover:scale-105 text-lg w-52"
      >
        😊 Feliz
      </button>

      <!-- Opción Normal -->
      <button
        onclick="window.location.href='Frases para cuando estes normal.html'"
        class="bg-yellow-400 hover:bg-yellow-500 text-black font-medium px-8 py-4 rounded-2xl shadow-lg transition-transform hover:scale-105 text-lg w-52"
      >
        😐 Normal
      </button>

      <!-- Opción Triste -->
      <button
        onclick="window.location.href='Frases para cuando estes tristes.html'"
        class="bg-red-500 hover:bg-red-600 text-white font-medium px-8 py-4 rounded-2xl shadow-lg transition-transform hover:scale-105 text-lg w-52"
      >
        😢 Triste
      </button>
    </div>
  </main>

  <script>
    function chooseMood(mood) {
      alert("Elegiste: " + mood); // Puedes cambiar esto por redirecciones o acciones reales.
    }
  </script>

</body>
</html>
